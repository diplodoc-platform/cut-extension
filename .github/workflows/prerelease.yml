name: Prerelease quality

on:
  pull_request:
    branches: ['codex/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Prerelease quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-workspaces
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Verify installed package
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:package
